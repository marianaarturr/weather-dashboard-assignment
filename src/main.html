<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Weather dashboard</title>
        <link rel="stylesheet" href="css/root.css" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/animations.css" />
        <link rel="stylesheet" href="css/responsive.css" />

        <script src="js/utils.js" defer></script>
        <script src="js/fetch.js" defer></script>
        <script src="js/render.js" defer></script>
        <script src="js/main.js" defer></script>
    </head>

    <body>
        <main>
            <section class="hero">
                <h1 class="title">
                    <span class="greeting">Hello!</span>
                    <span class="subtitle">How's the sky looking today?</span>
                </h1>

                <div class="search">
                    <input
                        class="text-box"
                        type="text"
                        name="search"
                        placeholder="Search for a city..."
                        aria-label="Search for a city..."
                    />
                    <button class="button" type="button">Search</button>
                </div>
            </section>

            <section class="current">
                <div class="location">
                    <h2 class="city"></h2>
                    <p class="date"></p>
                </div>

                <div class="info">
                    <img
                        class="icon"
                        src="../assets/images/icon-sunny.webp"
                        alt="Weather icon"
                        width="320"
                        height="320"
                    />
                    <div class="temperature"></div>
                </div>

                <div class="conditions">
                    <div class="box condition">
                        <p class="title">Feels like</p>
                        <p class="value apparent-temperature"></p>
                    </div>

                    <div class="box condition">
                        <p class="title">Humidity</p>
                        <p class="value humidity"></p>
                    </div>

                    <div class="box condition">
                        <p class="title">Wind</p>
                        <p class="value wind"></p>
                    </div>

                    <div class="box condition">
                        <p class="title">Precipitation</p>
                        <p class="value precipitation"></p>
                    </div>

                    <div class="box condition">
                        <p class="title">Average Temperature Today</p>
                        <p class="value average-temperature"></p>
                    </div>
                </div>
            </section>

            <section class="daily">
                <h2>Daily forecast</h2>

                <div class="container"></div>

                <template>
                    <div class="box day">
                        <p class="name"></p>
                        <img
                            class="icon"
                            src="../assets/images/icon-sunny.webp"
                            alt=""
                            width="320"
                            height="320"
                        />
                        <div class="temperatures">
                            <p class="min-temperature"></p>
                            <p class="max-temperature"></p>
                        </div>
                    </div>
                </template>
            </section>

            <section class="hourly">
                <h2>Hourly forecast</h2>
                <select class="dropdown" aria-label="Choose day"></select>

                <div class="container"></div>

                <template>
                    <div class="box hour">
                        <img
                            class="icon"
                            src="../assets/images/icon-sunny.webp"
                            alt=""
                            width="320"
                            height="320"
                        />
                        <p class="time"></p>
                        <p class="temperature"></p>
                    </div>
                </template>
            </section>
        </main>
    </body>
</html>
